<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>ODYSSEY RêVERIE · 预约终端</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Courier New",monospace;image-rendering:pixelated;}
body{background:#050508;color:#fff;min-height:100vh;position:relative;overflow-x:hidden;}

.scanline{
  position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(
    0deg,transparent,transparent 2px,rgba(255,42,109,0.04) 2px,rgba(255,42,109,0.04) 4px
  );
}
.vignette{
  position:fixed;inset:0;pointer-events:none;z-index:9998;
  box-shadow:inset 0 0 120px rgba(0,0,0,0.75);
}

.brand-transition{
  position:fixed;inset:0;z-index:10000;pointer-events:none;
  background:#050508;
  opacity:0;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:opacity 0.65s ease-out;
}
.brand-transition.flow-enter{
  opacity:1;
}
.brand-transition.flow-exit{
  opacity:0;
  transition:opacity 0.5s ease-in;
}
.brand-transition h2{
  color:#ff2a6d;
  font-size:22px;
  letter-spacing:4px;
  font-weight:bold;
  text-shadow:0 0 18px rgba(255,42,109,0.85),0 0 35px rgba(255,42,109,0.45);
  white-space:nowrap;
  animation:brandFlicker 1.8s steps(1) infinite;
}
@keyframes brandFlicker{
  0%,100%{transform:translate(0);opacity:1;}
  8%{transform:translate(-2px,1px);opacity:0.85;text-shadow:0 0 18px rgba(255,42,109,0.85),2px 0 0 #00f5d4;}
  10%{transform:translate(2px,-1px);opacity:1;}
  12%{transform:translate(-1px,0);opacity:0.9;text-shadow:0 0 18px rgba(255,42,109,0.85),-2px 0 0 #ff2a6d;}
  14%{transform:translate(0);opacity:1;}
  50%{opacity:0.95;}
  52%{opacity:0.7;transform:translate(1px,0);}
  54%{opacity:1;transform:translate(0);}
}

.btn{
  background:#11070a;color:#ff2a6d;border:3px solid #ff2a6d;
  padding:14px 22px;font-size:16px;cursor:pointer;letter-spacing:1px;
  text-shadow:0 0 6px rgba(255,42,109,0.6);
  box-shadow:0 0 8px rgba(255,42,109,0.3),inset 0 0 8px rgba(255,42,109,0.1);
}
.btn:hover{background:#ff2a6d;color:#000;text-shadow:none;box-shadow:0 0 16px rgba(255,42,109,0.8);}
.btn:active{transform:scale(0.96);}
.btn-primary{background:#ff2a6d;color:#000;font-weight:bold;text-shadow:none;}
.btn-primary:hover{background:#ff4d8a;}

.glitch{animation:glitch 0.24s steps(6);}
@keyframes glitch{
  0%{transform:translate(0);}
  20%{transform:translate(-1px,1px);}
  40%{transform:translate(-1px,-1px);}
  60%{transform:translate(1px,1px);}
  80%{transform:translate(1px,-1px);}
  100%{transform:translate(0);}
}

.page{display:none;padding:20px;min-height:100vh;position:relative;z-index:1;}
.page.active{display:block;}

#page-splash{
  display:none;align-items:center;justify-content:center;
  background:#050508;min-height:100vh;
  background:radial-gradient(ellipse at center, rgba(255,42,109,0.08) 0%, transparent 70%),#050508;
}
#page-splash.active{display:flex;}
.splash-logo{
  color:#ff2a6d;font-size:22px;letter-spacing:4px;
  text-shadow:0 0 20px rgba(255,42,109,0.8),0 0 40px rgba(255,42,109,0.4);
  animation:splashFlicker 1.8s steps(1) infinite;text-align:center;
}
@keyframes splashFlicker{
  0%,100%{transform:translate(0);opacity:1;}
  8%{transform:translate(-2px,1px);opacity:0.85;text-shadow:0 0 20px rgba(255,42,109,0.8),2px 0 0 #00f5d4;}
  10%{transform:translate(2px,-1px);opacity:1;}
  12%{transform:translate(-1px,0);opacity:0.9;text-shadow:0 0 20px rgba(255,42,109,0.8),-2px 0 0 #ff2a6d;}
  14%{transform:translate(0);opacity:1;}
  50%{opacity:0.95;}
  52%{opacity:0.7;transform:translate(1px,0);}
  54%{opacity:1;transform:translate(0);}
}

#page-start{
  display:none;flex-direction:column;align-items:center;justify-content:center;
  background:
    linear-gradient(rgba(5,5,8,0.92),rgba(5,5,8,0.98)),
    repeating-linear-gradient(0deg,#ff2a6d10 0 1px,transparent 1px 4px),
    repeating-linear-gradient(90deg,#ff2a6d10 0 1px,transparent 1px 4px);
  min-height:100vh;
}
#page-start.active{display:flex;}
.machine{
  width:100%;max-width:420px;background:#080812;border:6px solid #ff2a6d;border-radius:4px;padding:30px 24px;text-align:center;
  box-shadow:0 0 24px rgba(255,42,109,0.5),inset 0 0 24px rgba(255,42,109,0.08);position:relative;
}
.machine::before,.machine::after{content:"";position:absolute;width:12px;height:12px;border:3px solid #ff2a6d;}
.machine::before{top:-3px;left:-3px;border-right:none;border-bottom:none;}
.machine::after{bottom:-3px;right:-3px;border-left:none;border-top:none;}
.machine h1{color:#ff2a6d;font-size:18px;margin-bottom:8px;letter-spacing:2px;text-shadow:0 0 10px rgba(255,42,109,0.8);}
.machine .subtitle{color:#ff2a6d88;font-size:12px;margin-bottom:30px;letter-spacing:3px;}
.machine .btn{width:100%;margin-bottom:16px;font-size:17px;padding:16px;}

#page-form{
  background:
    linear-gradient(rgba(5,5,8,0.95),rgba(5,5,8,0.98)),
    repeating-linear-gradient(0deg,#ff2a6d08 0 1px,transparent 1px 4px);
}
.card{
  background:#0a0a18;border:3px solid #ff2a6d;border-radius:4px;padding:16px;margin-bottom:16px;overflow:hidden;
  box-shadow:0 0 12px rgba(255,42,109,0.25),inset 0 0 12px rgba(255,42,109,0.05);position:relative;
}
.card h3{color:#ff2a6d;font-size:16px;margin-bottom:12px;letter-spacing:1px;text-shadow:0 0 6px rgba(255,42,109,0.6);}
input,textarea{
  width:calc(100% - 20px);margin:0 auto 8px auto;display:block;background:#000;border:2px solid #ff2a6d;color:#ff2a6d;padding:10px;font-size:16px;outline:none;text-align:center;box-sizing:border-box;text-shadow:0 0 4px rgba(255,42,109,0.5);box-shadow:inset 0 0 8px rgba(255,42,109,0.15);
}
input:focus,textarea:focus{border-color:#ffd700;box-shadow:0 0 10px rgba(255,215,0,0.5),inset 0 0 8px rgba(255,215,0,0.1);}
input[type="date"]::-webkit-datetime-edit,input[type="time"]::-webkit-datetime-edit{text-align:center;width:100%;}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.option{
  border:2px solid #ff2a6d;padding:12px;text-align:center;cursor:pointer;color:#ff2a6d;background:#11070a;font-size:15px;display:flex;align-items:center;justify-content:center;min-height:50px;box-sizing:border-box;text-shadow:0 0 4px rgba(255,42,109,0.5);transition:all 0.1s;
}
.option:hover{border-color:#ffd700;color:#ffd700;text-shadow:0 0 8px rgba(255,215,0,0.8);}
.option.selected{background:#ff2a6d;color:#000;font-weight:bold;text-shadow:none;box-shadow:0 0 12px rgba(255,42,109,0.8);}
.form-actions{display:flex;gap:12px;margin-top:20px;}
.form-actions .btn{flex:1;}

.upload-wrap{margin-top:10px;}
#img-file{display:none;}
.upload-btn{
  width:100%;background:#11070a;color:#ff2a6d;border:2px dashed #ff2a6d;
  padding:12px;text-align:center;cursor:pointer;display:block;margin-bottom:10px;
}
.upload-btn:hover{border-color:#ffd700;color:#ffd700;}
.img-preview{
  width:100%;max-height:180px;object-fit:contain;border:2px solid #ff2a6d;border-radius:4px;display:none;
}

#page-ticket{
  display:none;flex-direction:column;align-items:center;justify-content:center;
  background:
    linear-gradient(rgba(5,5,8,0.95),rgba(5,5,8,0.98)),
    repeating-linear-gradient(0deg,#ff2a6d08 0 1px,transparent 1px 4px);
  min-height:100vh;padding:20px;
}
#page-ticket.active{display:flex;}
.ticket-img{
  width:100%;max-width:360px;border:5px solid #ff2a6d;box-shadow:0 0 24px rgba(255,42,109,0.6);margin-bottom:20px;image-rendering:auto;
}
#page-ticket .btn{width:100%;max-width:360px;}

@media(max-width:480px){.options{grid-template-columns:1fr;}.form-actions{flex-direction:column;}}
</style>
</head>
<body>
<div class="scanline"></div>
<div class="vignette"></div>

<div class="brand-transition" id="brandTransition">
  <h2>ODYSSEY RêVERIE</h2>
</div>

<div id="page-splash" class="page active"><div class="splash-logo">ODYSSEY RêVERIE</div></div>
<div id="page-start" class="page">
  <div class="machine" id="machine">
    <h1>ODYSSEY RêVERIE</h1>
    <div class="subtitle">— 自助预约办理 —</div>
    <button class="btn btn-primary" id="btn-go">约会开始</button>
    <button class="btn" id="btn-notsure">我还没想好</button>
  </div>
</div>
<div id="page-form" class="page">
  <div class="card">
    <h3>DATE & TIME</h3>
    <input type="date" id="date-val">
    <input type="time" id="time-val">
  </div>
  <div class="card">
    <h3>PROJECT</h3>
    <div class="options" id="options-list">
      <div class="option" data-val="探险">探险</div>
      <div class="option" data-val="小资">小资</div>
      <div class="option" data-val="甜品">甜品</div>
      <div class="option" data-val="惊喜">惊喜</div>
      <div class="option" data-val="计划表">计划表</div>
    </div>
  </div>
  <div class="card">
    <h3>REMARKS + ATTACHMENT</h3>
    <textarea id="note-val" rows="3" placeholder="填写注意事项..."></textarea>
    <div class="upload-wrap">
      <label class="upload-btn" for="img-file">ATTACH IMAGE</label>
      <input type="file" id="img-file" accept="image/*">
      <img id="preview-img" class="img-preview" alt="预览图">
      <canvas id="pixelPreview" class="img-preview" style="display:none;"></canvas>
    </div>
  </div>
  <div class="form-actions">
    <button class="btn" id="btn-back">返回</button>
    <button class="btn btn-primary" id="btn-submit">我已填写完毕</button>
  </div>
</div>
<div id="page-ticket" class="page">
  <img class="ticket-img" id="ticket-img" alt="预约凭证" />
  <button class="btn" id="btn-restart">重新预约</button>
</div>

<script>
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

let isTransitioning = false;
const brandTransition = document.getElementById('brandTransition');

function transitionTo(pageId, callback){
  if(isTransitioning) return;
  isTransitioning = true;

  brandTransition.classList.remove('flow-exit');
  brandTransition.classList.add('flow-enter');

  setTimeout(()=>{
    showPage(pageId);
    if(callback) callback();

    brandTransition.classList.remove('flow-enter');
    brandTransition.classList.add('flow-exit');

    setTimeout(()=>{
      brandTransition.classList.remove('flow-exit');
      isTransitioning = false;
    },500);
  },900);
}

function triggerGlitch(el){
  el.classList.remove('glitch');void el.offsetWidth;el.classList.add('glitch');
  setTimeout(()=>el.classList.remove('glitch'),300);
}

setTimeout(()=>transitionTo('page-start'),2000);

let selectedProject = '';
const options = document.querySelectorAll('.option');
for(const opt of options){
  opt.onclick = function(){
    options.forEach(o=>o.classList.remove('selected'));
    this.classList.add('selected');
    selectedProject = this.dataset.val;
    triggerGlitch(this);
  }
}

document.getElementById('btn-go').onclick = ()=>{
  triggerGlitch(document.getElementById('machine'));
  transitionTo('page-form');
};
document.getElementById('btn-notsure').onclick = function(){
  const btn = this;
  const parent = btn.parentElement;
  const maxX = parent.offsetWidth - btn.offsetWidth;
  const maxY = parent.offsetHeight - btn.offsetHeight;
  btn.style.position='relative';
  btn.style.left = Math.random()*maxX+'px';
  btn.style.top = Math.random()*maxY+'px';
  triggerGlitch(btn);
};
document.getElementById('btn-back').onclick = ()=>transitionTo('page-start');

// 图片上传 + 像素化预览
let attachImg = null;
const fileInput = document.getElementById('img-file');
const previewImg = document.getElementById('preview-img');
const pixelPreview = document.getElementById('pixelPreview');

fileInput.onchange = function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.src = ev.target.result;
    img.onload = ()=>{
      attachImg = img;
      previewImg.src = ev.target.result;
      previewImg.style.display = 'block';
      renderPixelPreview(img);
    };
  }
  reader.readAsDataURL(file);
}

// 像素化预览：降低分辨率，增强像素终端感
function renderPixelPreview(img){
  const canvas = pixelPreview;
  const ctx = canvas.getContext('2d');
  const size = 160;
  const pixelSize = 8;

  canvas.width = size;
  canvas.height = size;

  const temp = document.createElement('canvas');
  const tempCtx = temp.getContext('2d');
  temp.width = size / pixelSize;
  temp.height = size / pixelSize;

  tempCtx.drawImage(img,0,0,temp.width,temp.height);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(temp,0,0,temp.width,temp.height,0,0,size,size);

  pixelPreview.style.display = 'block';
  previewImg.style.display = 'none';
}

// 像素化图片辅助函数
function createPixelImage(img, maxSize=120){
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');

  const w = img.width;
  const h = img.height;
  const ratio = Math.min(maxSize/w, maxSize/h);

  const pixelW = Math.floor(w * ratio / 6) || 1;
  const pixelH = Math.floor(h * ratio / 6) || 1;

  canvas.width = w * ratio;
  canvas.height = h * ratio;

  const temp = document.createElement('canvas');
  temp.width = pixelW;
  temp.height = pixelH;

  const tempCtx = temp.getContext('2d');
  tempCtx.drawImage(img,0,0,pixelW,pixelH);

  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(temp,0,0,pixelW,pixelH,0,0,canvas.width,canvas.height);

  return canvas;
}

function generateTicket(time,project,note,attachImg){
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const w = 540;
  const h = 750;
  canvas.width = w;
  canvas.height = h;
  const cx = w / 2;

  // 基础票据底色
  ctx.fillStyle = '#fffef2';
  ctx.fillRect(0, 0, w, h);

  // 外边框
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 6;
  ctx.strokeRect(4, 4, w - 8, h - 8);

  // 顶部品牌条
  ctx.fillStyle = '#ff2a6d';
  ctx.fillRect(4, 4, w - 8, 48);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('ODYSSEY RêVERIE', cx, 35);

  // 顶部分隔虚线
  ctx.beginPath();
  ctx.setLineDash([6, 4]);
  ctx.moveTo(30, 70);
  ctx.lineTo(w - 30, 70);
  ctx.strokeStyle = '#999';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.setLineDash([]);

  // 左右圆形缺口
  ctx.fillStyle = '#050508';
  ctx.beginPath();
  ctx.arc(0, 250, 22, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(w, 250, 22, 0, Math.PI * 2);
  ctx.fill();

  // 标题区
  ctx.fillStyle = '#ff2a6d';
  ctx.font = 'bold 28px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('BOARDING PASS', cx, 115);

  ctx.font = '14px Courier New';
  ctx.fillStyle = '#666';
  ctx.fillText('— 预约凭证 —', cx, 138);

  // ===== 信息区排版 =====
  ctx.textAlign = 'center';
  const startY = 188;
  const labelHeight = 20;
  const valueHeight = 28;
  const rowGap = 62;
  const dividerOffset = 16;

  // DATE & TIME
  let currentY = startY;
  ctx.fillStyle = '#888';
  ctx.font = '13px Courier New';
  ctx.fillText('DATE & TIME', cx, currentY + labelHeight);
  ctx.fillStyle = '#111';
  ctx.font = 'bold 20px Courier New';
  ctx.fillText(time, cx, currentY + labelHeight + valueHeight);
  ctx.beginPath();
  ctx.moveTo(45, currentY + labelHeight + valueHeight + dividerOffset);
  ctx.lineTo(w - 45, currentY + labelHeight + valueHeight + dividerOffset);
  ctx.strokeStyle = '#ddd';
  ctx.lineWidth = 1;
  ctx.stroke();

  // PROJECT
  currentY += rowGap;
  ctx.fillStyle = '#888';
  ctx.font = '13px Courier New';
  ctx.fillText('PROJECT', cx, currentY + labelHeight);
  ctx.fillStyle = '#ff2a6d';
  ctx.font = 'bold 22px Courier New';
  ctx.fillText(project, cx, currentY + labelHeight + valueHeight);
  ctx.beginPath();
  ctx.moveTo(45, currentY + labelHeight + valueHeight + dividerOffset);
  ctx.lineTo(w - 45, currentY + labelHeight + valueHeight + dividerOffset);
  ctx.strokeStyle = '#ddd';
  ctx.lineWidth = 1;
  ctx.stroke();

  // REMARKS 区域
  currentY += rowGap;
  ctx.fillStyle = '#888';
  ctx.font = '13px Courier New';
  ctx.fillText('REMARKS', cx, currentY + labelHeight);

  let noteDrawY = currentY + labelHeight + valueHeight;
  const maxW = w - 90;

  ctx.fillStyle = '#111';
  ctx.font = '16px Courier New';
  let line = '';
  for(const c of note){
    const test = line + c;
    if(ctx.measureText(test).width > maxW && line !== ''){
      ctx.fillText(line, cx, noteDrawY);
      line = c;
      noteDrawY += 22;
    }else{
      line = test;
    }
  }
  ctx.fillText(line, cx, noteDrawY);
  noteDrawY += 24;

  // 附件图片：像素化 + 细粉色边框
  if(attachImg){
    const pixelImg = createPixelImage(attachImg, 130);

    const imgMaxW = w - 100;
    const imgMaxH = 130;
    const ratio = Math.min(imgMaxW / pixelImg.width, imgMaxH / pixelImg.height);
    const dw = pixelImg.width * ratio;
    const dh = pixelImg.height * ratio;
    const dx = (w - dw) / 2;

    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(pixelImg, dx, noteDrawY, dw, dh);

    // 细粉色边框
    ctx.strokeStyle = '#ff2a6d';
    ctx.lineWidth = 2;
    ctx.strokeRect(dx, noteDrawY, dw, dh);

    noteDrawY += dh + 12;
  }

  // 底部分隔虚线
  ctx.beginPath();
  ctx.setLineDash([6, 4]);
  ctx.moveTo(30, h - 80);
  ctx.lineTo(w - 30, h - 80);
  ctx.strokeStyle = '#999';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.setLineDash([]);

  // 底部文字
  ctx.fillStyle = '#666';
  ctx.font = '12px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('VALID FOR DATE ONLY • ODYSSEY RêVERIE', cx, h - 45);

  return canvas.toDataURL('image/png');
}

document.getElementById('btn-submit').onclick = function(){
  const date = document.getElementById('date-val').value || '未选择';
  const time = document.getElementById('time-val').value || '未选择';
  const proj = selectedProject || '未选择';
  const note = document.getElementById('note-val').value.trim() || '无';

  const fullTime = date + ' ' + time;
  document.getElementById('ticket-img').src = generateTicket(fullTime,proj,note,attachImg);

  triggerGlitch(document.getElementById('page-form'));
  transitionTo('page-ticket');
};

document.getElementById('btn-restart').onclick = ()=>transitionTo('page-start');
</script>
</body>
</html>
